# SPDX-License-Identifier: LicenseRef-App-Pending
# Bug report form (QA-R43). The diagnostics block is machine-parsed by a GitHub Action that applies
# labels app:<bundle>, macos:<major>, arch:<arm64|x86_64>, method:<telex|vni> (QA-R44).
name: Bug report (Báo lỗi)
description: Typing goes wrong in an app (Gõ sai, mất chữ, lặp chữ, không gõ được tiếng Việt)
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Cảm ơn bạn đã báo lỗi.

        **Easiest way:** in the app choose **Báo lỗi... (Report a problem...)** in the menu bar. It prepares everything below and copies the diagnostics block for you.

        **Please do not paste private text.** Retype a short example instead. The diagnostics block never contains what you typed. Bạn không cần gửi nhật ký hay chạy lệnh nào.
  - type: input
    id: app
    attributes:
      label: App where it happens, with its version (Ứng dụng bị lỗi và phiên bản)
      description: For example "Google Chrome 130" or "iTerm2 3.5". Check the version in the app's About window.
      placeholder: App name and version
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What you typed and what appeared (Bạn gõ gì và ra gì)
      description: Retype a short example yourself, in the form "I typed ... and expected ... but got ...". Do not paste private text.
      placeholder: |
        I typed: ...
        I expected: ...
        What appeared: ...
    validations:
      required: true
  - type: dropdown
    id: symptom
    attributes:
      label: Symptom (Triệu chứng)
      description: Choose all that apply.
      multiple: true
      options:
        - Lost letters (Mất chữ)
        - Duplicated letters (Lặp chữ)
        - Wrong tone or mark (Sai dấu)
        - Cannot type Vietnamese (Không gõ được tiếng Việt)
        - Lag or stutter (Chậm hoặc giật)
        - Other (Khác)
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics block (Khối chẩn đoán)
      description: In the app, choose Báo lỗi... > Mở GitHub; the block is copied to your clipboard. Paste it here exactly as it is, with its fence lines. The block starts with the header line `<slug>-diagnostics v1` (the app's short name, then the format version). You can preview it first with "Xem trước dữ liệu sẽ gửi". If you cannot open the app, write "not available".
      placeholder: Paste the diagnostics block here
    validations:
      required: true
  - type: dropdown
    id: practice-field
    attributes:
      label: Does it also happen in the app's own practice field? (Có lỗi trong ô gõ thử của ứng dụng không?)
      description: In the report window, use the button that opens the practice field and retype the same example.
      options:
        - "No, only in the app above (Không, chỉ ở ứng dụng trên)"
        - "Yes, also in the practice field (Có, cả ở ô gõ thử)"
        - "I could not try (Chưa thử được)"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy (Riêng tư)
      options:
        - label: I did not paste private text, passwords or personal data in this report. (Tôi không dán nội dung riêng tư vào báo cáo này.)
          required: true

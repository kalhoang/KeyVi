# SPDX-License-Identifier: LicenseRef-App-Pending
# Website build (QA-R22, PRD-R73): Vietnamese at /, English at /en/, compatibility matrix from
# compat/matrix.json, changelog from CHANGELOG.md, download data from site/data/releases.json and the
# Sparkle feed site/static/appcast.xml (one stable URL, PLT-R1101).
#
# This workflow tests and builds; it never deploys. The website runs as a container on the Kalera Docker Swarm,
# built and redeployed by site-image.yml from the branch `prod` only (ADR 0602, docs/runbooks/site-deploy.md).
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "compat/**"
      - "CHANGELOG.md"
      - "CHANGELOG.vi.md"
      - ".github/workflows/site.yml"
      # site/test.mjs also checks the help anchors the app opens and the documented settings export format.
      - "App/Resources/Localization/**"
      - "Packages/AppCore/Sources/InputHost/Integration/ShellActions.swift"
      - "Packages/AppCore/Sources/SettingsStore/ExportImport.swift"
      - "Packages/AppCore/Sources/SettingsStore/Documents.swift"
      - "scripts/brand.env"
      - "deploy/site/**"
  pull_request:
    paths:
      - "site/**"
      - "compat/**"
      - "CHANGELOG.md"
      - "CHANGELOG.vi.md"
      - ".github/workflows/site.yml"
      # site/test.mjs also checks the help anchors the app opens and the documented settings export format.
      - "App/Resources/Localization/**"
      - "Packages/AppCore/Sources/InputHost/Integration/ShellActions.swift"
      - "Packages/AppCore/Sources/SettingsStore/ExportImport.swift"
      - "Packages/AppCore/Sources/SettingsStore/Documents.swift"
      - "scripts/brand.env"
      - "deploy/site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Site tests (pages, links and anchors, lang attributes, PRD-R74 privacy rules, appcast, sitemap)
        run: node site/test.mjs
      - name: Container tests (nginx headers equal static/_headers, image build script, live header check)
        run: node deploy/site/test.mjs
      - name: Build (node site/build.mjs -> site/dist)
        # ADR 0601: the deployed image is strict unless SITE_STRICT=false (site-image.yml). Here SITE_STRICT=true
        # makes every build strict, so VERIFY markers show up on pull requests before they block a deploy.
        env:
          STRICT: ${{ vars.SITE_STRICT == 'true' }}
        run: |
          if [[ "$STRICT" == true ]]; then node site/build.mjs --strict; else node site/build.mjs; fi
      - name: Appcast is well-formed XML
        run: |
          if [[ -f site/dist/appcast.xml ]]; then
            python3 -I -c 'import sys, xml.etree.ElementTree as ET; ET.parse(sys.argv[1])' site/dist/appcast.xml
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          retention-days: 14

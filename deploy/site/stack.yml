#
# Portainer stack of the website on the Kalera Docker Swarm (ADR 0602, docs/runbooks/site-deploy.md). Every name and
# host comes from the stack's environment variables, printed by deploy/site/stack-env.sh from scripts/brand.env:
# SITE_HOST, SITE_SLUG, IMAGE_OWNER, IMAGE_NAME and IMAGE_TAG (prod). TRAEFIK_CERT_RESOLVER is optional.
#
# Traefik labels follow the stacks that already run on this Swarm: network traefik_public, entrypoints websecure (TLS)
# and web (redirect to HTTPS), certificate resolver `cloudflare` (the Cloudflare DNS challenge of the shared traefik2
# stack). The shared traefik2 runs the v3 Swarm provider and skips a service whose labels mix traefik.docker.* and
# traefik.swarm.* ("both Docker and Swarm labels are defined"), so only traefik.swarm.network is set. Both facts were
# confirmed by the analytics stack (deploy/umami/stack.yml) on 2026-11-13 (ADR 0602 decision 5).
# Interpolation is docker/cli's (`docker stack deploy`, Portainer Swarm stacks), which is stricter than Compose: a
# braced form with a default or a required message runs to the last closing brace of its line, and it is split at the
# first `-` before `:?` is tried, so a message with a dash becomes a default value. Each line therefore holds at most
# one such form, last on the line, and required messages carry no dash (scripts/tests/test_site_deploy.py renders
# this file the way docker/cli does). An empty IMAGE_OWNER or IMAGE_NAME still fails the deploy with "invalid
# reference format".
# `version` is obsolete for Compose but older `docker stack deploy` releases still require it.
version: "3.8"

services:
  site:
    image: ghcr.io/${IMAGE_OWNER}/${IMAGE_NAME}:${IMAGE_TAG:-prod}
    networks:
      - traefik_public
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik_public
        - traefik.http.routers.${SITE_SLUG}-site.rule=Host(`${SITE_HOST:?SITE_HOST is not set, see the stack env script}`)
        - traefik.http.routers.${SITE_SLUG:?SITE_SLUG is not set, see the stack env script}-site.entrypoints=websecure
        - traefik.http.routers.${SITE_SLUG}-site.tls=true
        - traefik.http.routers.${SITE_SLUG}-site.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-cloudflare}
        - traefik.http.routers.${SITE_SLUG}-site.service=${SITE_SLUG}-site
        - traefik.http.services.${SITE_SLUG}-site.loadbalancer.server.port=8080
        - traefik.http.services.${SITE_SLUG}-site.loadbalancer.healthcheck.path=/healthz
        - traefik.http.services.${SITE_SLUG}-site.loadbalancer.healthcheck.interval=10s
        - traefik.http.routers.${SITE_SLUG}-site-web.rule=Host(`${SITE_HOST}`)
        - traefik.http.routers.${SITE_SLUG}-site-web.entrypoints=web
        - traefik.http.routers.${SITE_SLUG}-site-web.middlewares=${SITE_SLUG}-site-https
        - traefik.http.middlewares.${SITE_SLUG}-site-https.redirectscheme.scheme=https
        - traefik.http.middlewares.${SITE_SLUG}-site-https.redirectscheme.permanent=true

networks:
  traefik_public:
    external: true
    name: traefik_public

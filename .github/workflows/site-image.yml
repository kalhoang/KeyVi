# SPDX-License-Identifier: LicenseRef-App-Pending
# Website image (ADR 0602, docs/runbooks/site-deploy.md): build the site container, prove that the running container
# sends the headers of site/static/_headers, push it to GHCR and redeploy the Swarm service through its Portainer
# webhook. Kalera rule: image builds and deploy webhooks run ONLY on the branch `prod`, never on main or on pull
# requests (main and pull requests run site.yml, which tests and builds the site without an image).
#
# Repository settings (Pa): environment `site` with the secret PORTAINER_WEBHOOK_URL (the service webhook of the
# stack's `site` service; empty means push only); repository variables IMAGE_OWNER (GHCR namespace, default: the
# repository owner), SITE_IMAGE_NAME (default: <slug>-site from scripts/brand.env) and SITE_STRICT (`false` builds the
# preview, with X-Robots-Tag: noindex, until the first public release; anything else builds strictly).
name: Site image

on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-image
  cancel-in-progress: false

jobs:
  image:
    name: Build, check, push and deploy the site image
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: site
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_OWNER: ${{ vars.IMAGE_OWNER || github.repository_owner }}
      SITE_IMAGE_NAME: ${{ vars.SITE_IMAGE_NAME }}
      SITE_STRICT: ${{ vars.SITE_STRICT == 'false' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Site and container tests
        run: |
          node site/test.mjs
          node deploy/site/test.mjs
      - name: Image reference (deploy/site/stack-env.sh, from scripts/brand.env)
        run: deploy/site/stack-env.sh --tag prod | tee -a "$GITHUB_ENV"
      - name: Release files served under /download/ (Q10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I deploy/site/fetch-downloads.py --out deploy/site/downloads --repo "$GITHUB_REPOSITORY"
      - name: Build the image (linux/amd64)
        run: |
          docker build -f deploy/site/Dockerfile --platform linux/amd64 \
            --build-arg SITE_STRICT="$SITE_STRICT" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:sha-$GITHUB_SHA" .
      - name: The running container sends every header of _headers (ADR 0602)
        run: |
          image="ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:sha-$GITHUB_SHA"
          docker run -d --name site-check --read-only --tmpfs /tmp -p 127.0.0.1:8080:8080 "$image"
          trap 'docker logs site-check; docker rm -f site-check >/dev/null' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break; sleep 1; done
          docker cp site-check:/etc/nginx/site/_headers "$RUNNER_TEMP/_headers"
          docker exec site-check find /srv/site -type f | sed 's#^/srv/site##' > "$RUNNER_TEMP/files.txt"
          node deploy/site/check-live-headers.mjs --base http://127.0.0.1:8080 \
            --headers "$RUNNER_TEMP/_headers" --files "$RUNNER_TEMP/files.txt"
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:sha-$GITHUB_SHA" "$IMAGE"
          docker push "ghcr.io/$IMAGE_OWNER/$IMAGE_NAME:sha-$GITHUB_SHA"
          docker push "$IMAGE"
          docker logout ghcr.io
      - name: Redeploy through the Portainer webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [[ -z "$PORTAINER_WEBHOOK_URL" ]]; then
            echo "::warning::PORTAINER_WEBHOOK_URL is not set; the image was pushed but the service was not redeployed."
            exit 0
          fi
          curl -fsS -X POST --max-time 60 "$PORTAINER_WEBHOOK_URL" >/dev/null
          echo "Redeploy requested for $IMAGE" >> "$GITHUB_STEP_SUMMARY"

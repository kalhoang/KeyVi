# SPDX-License-Identifier: LicenseRef-App-Pending
# Continuous integration (QA-R22, QA-R2, QA-R5, QA-R8 per PR, QA-R14, QA-R24, PLT-R820, PLT-R822).
# Runner labels, Xcode and Swift pins were verified on 2026-11-13: docs/decisions/0500.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml re-runs the full suite on the tagged commit (QA-R30 step 1).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ENGINE: Packages/VietnameseEngine
  APPCORE: Packages/AppCore

jobs:
  engine-linux:
    name: Engine on Linux (tests, corpus, property, 60 s fuzz)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Official Swift toolchain image, pinned by digest (swift:6.4.2-noble). Same Swift as Xcode 27.2.
      image: swift:6.4.2-noble@sha256:23d9b28ad97fb1cf1999edc3a0cb265ee915ed42299a9344e7173d5a6d2b05f4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install python3 for the repository scripts
        run: command -v python3 >/dev/null || (apt-get update -qq && apt-get install -y -qq --no-install-recommends python3)
      - name: Generated engine sources and corpus files match their generators (ENG-R301, QA-R4)
        run: |
          python3 -I "$ENGINE/Scripts/generate-letter-table.py" --check
          python3 -I "$ENGINE/Scripts/extract-spec-examples.py" --check
          python3 -I "$ENGINE/Scripts/generate-layout-corpus.py" --check
      - name: Every engine requirement has a traceability row (spec/01-engine.md)
        run: python3 -I "$ENGINE/Scripts/check-traceability.py"
      - name: Build engine (ENG-R1201, Linux)
        run: swift build --package-path "$ENGINE"
      - name: Engine tests, corpus and property tests (QA-R5, QA-R8)
        run: swift test --package-path "$ENGINE" --parallel
      - name: Coverage-guided fuzzing of engine-fuzz, 60 s, both methods (QA-R8)
        # libFuzzer flags from Packages/VietnameseEngineFuzz/README.md (VERIFY on the first Linux run, ADR 0502).
        run: scripts/fuzz.sh --seconds 60 --sanitizers fuzzer,address --out .build/fuzz-out --require
      - name: Upload fuzz findings
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings-pr
          path: .build/fuzz-out
          if-no-files-found: ignore
          retention-days: 14

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (preinstalled on the Ubuntu image)
        run: |
          shellcheck --version | head -n2
          find scripts -type f \( -name '*.sh' -o -name 'publish-release' \) -print0 \
            | xargs -0 shellcheck -x -P scripts:scripts/lib
      - name: actionlint (pinned download, SHA-256 verified)
        run: |
          curl -fsSL -o /tmp/actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color -config-file scripts/actionlint.yaml
      - name: Script self-tests
        run: scripts/tests/run.sh --no-macos
      - name: SPDX headers (CLR-R11)
        run: scripts/check-spdx.sh
      - name: Brand files agree (Config/Brand.xcconfig and scripts/brand.env)
        run: python3 -I scripts/check-brand-sync.py
      - name: Remaining unimplemented() calls (report only; release.yml blocks them)
        run: scripts/check-unimplemented.sh --report

  contracts:
    name: Architecture contracts in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: docs/architecture/contracts.md matches the compiled contract sources
        run: python3 -I docs/architecture/tools/sync_contracts.py --check

  dco:
    name: DCO sign-off on engine commits (external pull requests)
    # ADR 0401: external contributions to the MPL-2.0 engine package need a Developer Certificate of Origin
    # sign-off on every commit. External means the pull request comes from a fork.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Every commit touching the MPL-2.0 engine packages is signed off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/check-dco.sh --base "$BASE_SHA" --head "$HEAD_SHA" \
            --path Packages/VietnameseEngine --path Packages/VietnameseEngineFuzz

  macos-tests:
    name: macOS lint, tests and coverage
    # Xcode 27 image (macOS 27, preview label as of 2026-11-13); fallback documented in ADR 0500.
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # coverage baseline from the latest green main run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Lint (swift-format, bundle IDs, log interpolation, rules, forward delete, SPDX)
        run: scripts/lint.sh --skip shellcheck
      - name: Coverage baseline from main (QA-R2, drop of more than 1 point fails)
        # found=false only when main has no green run yet; a failed lookup or download (expired artifact, token,
        # network) leaves it unset, and the coverage steps below then fail on the missing baseline (fail closed).
        id: baseline
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name coverage-summary --dir .build/coverage-baseline
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No green ci.yml run on main yet: the coverage drop check is skipped (QA-R2)."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Engine tests with coverage (at least 95 %, QA-R2)
        env:
          REQUIRE_BASELINE: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.found != 'false' }}
        run: |
          require=()
          [[ "$REQUIRE_BASELINE" == true ]] && require=(--require-baseline)
          scripts/coverage.sh --package "$ENGINE" --min 95 \
            --exclude '^Sources/(lexicon-builder|engine-benchmark|VietnameseEngineTesting)/' \
            --baseline .build/coverage-baseline/engine.json --summary-out .build/coverage/engine.json \
            ${require[@]+"${require[@]}"}
      - name: Engine core target coverage, at least 95 % (QA-R2)
        # The gate of Packages/VietnameseEngine/Scripts/coverage.sh (Sources/VietnameseEngine only), read from
        # the export the step above wrote, so the engine tests run once. Both steps use the default scratch path
        # (.build); give them the same --scratch-path if one ever changes, or this reads a stale or missing file.
        run: python3 -I "$ENGINE/Scripts/coverage.py" "$(swift test --package-path "$ENGINE" --show-codecov-path)"
      - name: AppCore tests with coverage (at least 80 %, QA-R2)
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        env:
          REQUIRE_BASELINE: ${{ github.event_name == 'pull_request' && steps.baseline.outputs.found != 'false' }}
        run: |
          require=()
          [[ "$REQUIRE_BASELINE" == true ]] && require=(--require-baseline)
          scripts/coverage.sh --package "$APPCORE" --min 80 \
            --exclude '^Sources/(CompatHarness|TestSupport)/' \
            --baseline .build/coverage-baseline/appcore.json --summary-out .build/coverage/appcore.json \
            ${require[@]+"${require[@]}"}
      - name: Compatibility rules and matrix lint (compat-lint, PLT-R505, PLT-R506, PLT-R521, PLT-R531)
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        run: swift run --package-path "$APPCORE" compat-lint
      - name: Compatibility scenarios, plan only (compat-harness --dry-run, no events posted)
        # Skipped until compat/scenarios exists (W2-E1); the script also skips while the product is missing.
        if: hashFiles('compat/scenarios/**') != ''
        run: scripts/compat-dry-run.sh --out .build/compat-dry-run.txt
      - name: Pinned data inputs match their manifest (ENG-R810)
        run: (cd data && shasum -a 256 -c inputs/MANIFEST.sha256)
      - name: Bundled data is reproducible (ENG-R810)
        run: swift run --package-path "$ENGINE" lexicon-builder check
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: .build/coverage/
          if-no-files-found: ignore
          retention-days: 90

  macos-x86_64:
    name: AppCore tests for the x86_64 slice under Rosetta (PLT-R105)
    # ADR 0315: Intel Macs are supported (macOS 12 to 26). There is no hosted Intel runner with Xcode 27, so the
    # Apple-silicon runner builds the x86_64 slice of the AppCore suite and runs it through Rosetta 2.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Rosetta 2 is available
        # Preinstalled on the hosted arm64 images (VERIFY on the xcode-27 preview image); installed otherwise.
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          test "$(arch -x86_64 /usr/bin/uname -m)" = x86_64
      - name: Build the AppCore tests, x86_64 slice (PLT-R105, PLT-R106)
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        run: swift build --package-path "$APPCORE" --arch x86_64 --build-tests --scratch-path .build/x86_64
      - name: Run the AppCore tests under Rosetta
        # The SwiftPM test helpers of Xcode 27 are arm64-only, so `swift test --arch x86_64` cannot load the
        # bundles. The universal `xctest` runner, started as x86_64, runs every XCTest and Swift Testing test of
        # a bundle and exits non-zero when one fails.
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        run: |
          bin="$(swift build --package-path "$APPCORE" --arch x86_64 --scratch-path .build/x86_64 --show-bin-path)"
          failed=0
          for bundle in "$bin"/*.xctest; do
            echo "::group::$(basename "$bundle")"
            arch -x86_64 xcrun xctest "$bundle" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  benchmarks:
    name: macOS benchmarks (engine ENG-T40, pipeline PLT-R820)
    # QA-R14: the same runner class every time (the xcode-27 image with Xcode 27.2, ADR 0500 and 0506), in a job
    # of its own so no other step competes for the CPU while it measures.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/select-xcode
      - name: Engine benchmark and calibrated gate (ENG-R1230, ENG-R1233, QA-R14)
        # Median of 5 release runs compared with Packages/VietnameseEngine/Benchmarks/baseline.json; exit 1 fails.
        run: |
          mkdir -p .build/bench
          "$ENGINE/Scripts/benchmark.sh" "$PWD/.build/bench/engine.json"
      - name: Pipeline benchmark, 5 release runs (PLT-R820, T1 with fakes)
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        run: |
          mkdir -p .build/bench/pipeline
          for run in 1 2 3 4 5; do
            PIPELINE_BENCH_OUTPUT="$PWD/.build/bench/pipeline/run-$run.json" \
              swift test --package-path "$APPCORE" -c release --filter PipelineBenchmark
          done
      - name: Pipeline benchmark gate, 25 % against the baseline and the T1 gate (PLT-R822)
        if: hashFiles('Packages/AppCore/Package.swift') != ''
        run: |
          results=()
          for file in .build/bench/pipeline/run-*.json; do results+=(--results "$file"); done
          scripts/bench-compare.sh "${results[@]}" --threshold 25 \
            --baseline Packages/AppCore/Benchmarks/pipeline-baseline.json \
            --output .build/bench/pipeline-median.json
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmarks
          path: .build/bench/
          if-no-files-found: ignore
          retention-days: 90

  macos-app:
    name: macOS universal Debug build (unsigned)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check for the app project
        id: project
        run: |
          if [[ -f project.yml ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: ./.github/actions/select-xcode
        if: steps.project.outputs.present == 'true'
      - name: Install pinned XcodeGen
        if: steps.project.outputs.present == 'true'
        run: scripts/install-xcodegen.sh
      - name: Generate the Xcode project
        if: steps.project.outputs.present == 'true'
        run: xcodegen generate
      - name: Build universal Debug, unsigned (PLT-R105)
        # -disableAutomaticPackageResolution: a drift from Config/Package.resolved fails (PLT-R910, ADR 0301).
        if: steps.project.outputs.present == 'true'
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath .build/DerivedData \
            -disableAutomaticPackageResolution \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' build
      - name: Both slices and the macOS 12.0 floor (PLT-R105, PLT-R106, ADR 0315)
        if: steps.project.outputs.present == 'true'
        run: |
          app="$(find .build/DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' -type d | head -n1)"
          test -n "$app"
          plist="$app/Contents/Info.plist"
          binary="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")"
          for arch in arm64 x86_64; do
            lipo "$binary" -verify_arch "$arch"
            otool -arch "$arch" -l "$binary" | grep -A4 LC_BUILD_VERSION | grep -Eq 'minos 12\.0$'
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = 12.0
      - name: URL host allowlist on the built app (QA-R60)
        if: steps.project.outputs.present == 'true'
        run: |
          app="$(find .build/DerivedData/Build/Products/Debug -maxdepth 1 -name '*.app' -type d | head -n1)"
          test -n "$app"
          scripts/check-url-hosts.sh --list "$app"
      - name: Sparkle wrapper tests (UpdaterTests; PLT-R1105, PLT-R104, PLT-R1101, PLT-R1102, QA-R3)
        # The App scheme's test action. UpdaterTests has no TEST_HOST, so nothing launches the app; it reads the
        # Debug app's Info.plist and frameworks from the products directory (BuiltBundleTests).
        if: steps.project.outputs.present == 'true'
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath .build/DerivedData \
            -disableAutomaticPackageResolution -resultBundlePath .build/UpdaterTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY='' test -only-testing:UpdaterTests
      - name: Upload the UpdaterTests result bundle
        if: failure() && steps.project.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updater-tests-xcresult
          path: .build/UpdaterTests.xcresult
          if-no-files-found: ignore
          retention-days: 14

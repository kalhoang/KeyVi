# nginx configuration of the site container (ADR 0602). Runs as the unprivileged nginx user of the base image,
# listens on 8080 behind Traefik (which terminates TLS), and serves the static site built by deploy/site/build.mjs.
# Response headers are NOT written here: /etc/nginx/site/locations.conf is generated from the deployed _headers
# (site/static/_headers after the build), so the container and the file can never disagree.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    # application/rss+xml is left out: the appcast location sets its full Content-Type itself.
    charset_types text/html text/css text/plain text/xml application/javascript image/svg+xml;

    # Privacy (PRD-R74, PRD-R76, /rieng-tu): one line per request with the time, method, path without the query
    # string, status and size. No client address, user agent or referrer is ever written.
    log_format privacy '$time_iso8601 "$request_method $uri" $status $body_bytes_sent';
    access_log /dev/stdout privacy;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain text/xml application/javascript application/json application/rss+xml application/xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /srv/site;
        index index.html;
        # Redirects (a directory without its trailing slash) stay relative, so they never name the container port or
        # plain HTTP behind the TLS proxy.
        absolute_redirect off;
        error_page 404 /404.html;

        include /etc/nginx/site/locations.conf;
    }
}

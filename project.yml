# SPDX-License-Identifier: LicenseRef-App-Pending
#
# XcodeGen spec (docs/decisions/0301-xcodegen-project.md). `xcodegen generate` writes App.xcodeproj, which is
# never committed. Target and scheme names are brand-neutral; the product name, bundle IDs and site host come
# from Config/Brand.xcconfig through Config/Debug.xcconfig and Config/Release.xcconfig.
# FROZEN for wave-1 workstreams: changes go through the integrator (docs/architecture/workstreams.md).

name: App
options:
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: vi
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  # PLT-R104, PLT-R910: the resolved Sparkle revision is committed at Config/Package.resolved and copied into
  # the generated project; CI builds with -disableAutomaticPackageResolution so a mismatch fails.
  postGenCommand: >-
    mkdir -p App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm &&
    cp Config/Package.resolved App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

# Integration: the self-hosted runner's test build with the INTEGRATION_HOOKS condition (ADR 0502); never shipped.
configs:
  Debug: debug
  Release: release
  Integration: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
  Integration: Config/Integration.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_ENTITLEMENTS: ""
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  AppCore:
    path: Packages/AppCore
  VietnameseEngine:
    path: Packages/VietnameseEngine
  # PLT-R104: the only third-party runtime dependency, pinned exactly (docs/decisions/0304-sparkle-version-pin.md).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  App:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          - "Updater/Tests/**"
      - path: App/Resources
    settings:
      base:
        PRODUCT_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_MODULE_NAME: App
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: AppCore
        products: [AppModel, RealtimeSupport, Diagnostics, SettingsStore, CompatRules, Injection, InputHost, ShellCore]
      - package: VietnameseEngine
        products: [VietnameseEngine, VietnameseEngineData]
      - package: Sparkle
        product: Sparkle
    postCompileScripts:
      # PLT-R503, PRD-R38: ship compat/rules.json as compat-rules.json and compat/matrix.json as
      # compat-matrix.json. Missing files fail Release builds; Debug falls back to the embedded ruleset.
      - name: Copy compatibility data
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          mkdir -p "$dest"
          for pair in "rules.json:compat-rules.json" "matrix.json:compat-matrix.json"; do
            src="${SRCROOT}/compat/${pair%%:*}"
            if [ -f "$src" ]; then
              cp "$src" "$dest/${pair##*:}"
            elif [ "${CONFIGURATION}" = "Release" ]; then
              echo "error: missing $src" >&2; exit 1
            else
              echo "warning: missing $src (Debug uses the embedded ruleset)"
            fi
          done

  # W2-D: logic tests of the Sparkle wrapper (QA-R3). No TEST_HOST, so running them never launches the app; the
  # App scheme builds the app first, and BuiltBundleTests reads its Info.plist and frameworks from the products
  # directory. UPDATER_TESTS turns on the test files under App/Sources/Updater/Tests (excluded from App).
  UpdaterTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Sources/Updater
      # The shipped Updates catalog (compiled into the bundle's lproj folders) and the site's routes as resources,
      # so the tests never open repository files at run time (xctest has no access to every volume).
      - path: App/Resources/Localization/Updates.xcstrings
      - path: site/lib/routes.mjs
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_DEV).updatertests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) UPDATER_TESTS
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: AppCore
        products: [AppModel, RealtimeSupport, Diagnostics, SettingsStore, ShellCore, TestSupport]
      - package: Sparkle
        product: Sparkle

  # QA-R10 test host app for platform integration tests. Never shipped. Ad-hoc signed: it needs no
  # permissions and no stable signing identity (the app under test is the one that holds TCC grants).
  TestHost:
    type: application
    platform: macOS
    sources:
      - path: TestHost/Sources
      - path: TestHost/Resources
    settings:
      base:
        PRODUCT_NAME: TestHost
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_DEV).testhost
        INFOPLIST_FILE: TestHost/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  # PLT-R398D spike S1: minimal InputMethodKit input method (an .app bundle with the IMK Info.plist keys; the
  # bundle ID contains ".inputmethod." as macOS expects). Built and installed only by Pa (SpikeIMK/README.md),
  # signed with the Debug identity (Apple Development). Never shipped and never creates an event tap (PLT-R207).
  SpikeIMK:
    type: application
    platform: macOS
    sources:
      - path: SpikeIMK/Sources
      - path: SpikeIMK/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SpikeIMK
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID_DEV).inputmethod.SpikeIMK
        INFOPLIST_FILE: SpikeIMK/Info.plist

schemes:
  App:
    build:
      targets:
        App: all
    test:
      targets: [UpdaterTests]
    run:
      config: Debug
    archive:
      config: Release
  TestHost:
    build:
      targets:
        TestHost: all
  SpikeIMK:
    build:
      targets:
        SpikeIMK: all

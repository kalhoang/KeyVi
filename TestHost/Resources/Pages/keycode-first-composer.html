<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!-- 13.2 local page: a chat composer that acts on the key code first (PLT-R405). Its keydown listener deletes on
     event.code "Backspace" and sends on event.code "Enter", whatever character the event carries, and it types on
     keypress. Chromium (so Electron chat apps) and WebKit derive event.code, and for a non-ASCII character also
     event.keyCode, from the virtual key code, so an edit posted on the key that triggered it deletes or sends
     instead of typing. Every edit goes through these handlers, never through the browser's own editing, so the
     field shows exactly what the handlers did. A send appends the marker <send> to the field instead of clearing
     it, so the readback shows each send once, in order. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Key-code-first composer</title>
  <link rel="stylesheet" href="testhost.css">
  <script src="testhost.js"></script>
</head>
<body>
  <label for="keycode-composer">Message</label>
  <textarea id="keycode-composer" class="testhost-keycode-composer" rows="3" spellcheck="false"
            autocomplete="off" data-testhost-field="testhost.web.textarea"></textarea>
  <script>
    // SPDX-License-Identifier: GPL-3.0-or-later
    (function () {
      "use strict";
      var composer = document.getElementById("keycode-composer");
      var sendMarker = "<send>";

      function show(text) {
        composer.value = text;
        composer.setSelectionRange(text.length, text.length);
        window.TestHost.mirror(composer);
      }

      // The key code decides, like composers that read keydown.code (or keyCode 8 and 13).
      composer.addEventListener("keydown", function (event) {
        if (event.metaKey || event.ctrlKey || event.altKey) {
          return;
        }
        if (event.code === "Backspace") {
          event.preventDefault();
          show(Array.from(composer.value).slice(0, -1).join(""));
        } else if (event.code === "Enter" || event.code === "NumpadEnter") {
          event.preventDefault();
          show(composer.value + sendMarker);
        }
      });

      // Characters are typed on keypress, from the event's key.
      composer.addEventListener("keypress", function (event) {
        if (event.metaKey || event.ctrlKey || event.key.length === 0 || event.key === "Enter") {
          return;
        }
        event.preventDefault();
        show(composer.value + event.key);
      });

      // Nothing else edits the field: an insertion that came without a keypress is typed the same way, and the
      // browser's own deletions (which only a Backspace key code may cause here) are refused.
      composer.addEventListener("beforeinput", function (event) {
        event.preventDefault();
        if (event.inputType === "insertText" && typeof event.data === "string" && event.data.length > 0) {
          show(composer.value + event.data);
        }
      });
    })();
  </script>
</body>
</html>
